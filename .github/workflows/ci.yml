name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest # Docker is available here, so the Testcontainers tests really run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - run: ./mvnw -B verify
